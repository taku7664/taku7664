<svg xmlns="http://www.w3.org/2000/svg" width="284" height="148" viewBox="0 0 284 148">
  <style>
    text { font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Helvetica, Arial, sans-serif; }
    .name { font-size: 20px; font-weight: 700; fill: #f0f6fc; }
    .lv { font-size: 13px; font-weight: 600; fill: #8b949e; }
    .lvnum { font-size: 17px; font-weight: 800; fill: #f0f6fc; }
    .chip { font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .repo { font-size: 11px; fill: #58a6ff; text-decoration: underline; }
    .float { animation: float 3s ease-in-out infinite; animation-delay: 0.70s; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @media (prefers-reduced-motion: reduce) { .float { animation: none } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6B91A" stop-opacity=".38"/>
      <stop offset="1" stop-color="#E2BF65" stop-opacity=".10"/>
    </linearGradient>
    <radialGradient id="r"><stop offset="0" stop-color="#A6B91A" stop-opacity=".55"/><stop offset="1" stop-color="#A6B91A" stop-opacity="0"/></radialGradient>
  </defs>
  <g transform="translate(6,6)">
    <rect width="272" height="136" rx="18" fill="#161b22"/>
    <rect width="272" height="136" rx="18" fill="url(#g)" stroke="#A6B91A" stroke-opacity=".45"/>
    <circle cx="60" cy="68" r="56" fill="url(#r)"/>
    <g class="float"><image href="data:image/png;base64," x="4" y="12" width="112" height="112"/></g>
    <text x="118" y="34" class="name">토중몬</text>
    <text x="118" y="56" class="lv">Lv.<tspan class="lvnum">1</tspan></text>
    
    <g transform="translate(118,76)">
      <rect width="52" height="18" rx="9" fill="#A6B91A"/>
      <text x="26" y="13" class="chip">벌레</text>
    </g>
    <g transform="translate(176,76)">
      <rect width="52" height="18" rx="9" fill="#E2BF65"/>
      <text x="26" y="13" class="chip">땅</text>
    </g>
    <rect x="118" y="104" width="132" height="6" rx="3" fill="#ffffff" fill-opacity=".12"/>
    <rect x="118" y="104" width="4" height="6" rx="3" fill="#A6B91A"/>
    <text x="118" y="126" class="repo">DemoMaker</text>
  </g>
</svg>
