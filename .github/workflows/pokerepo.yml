name: pokerepo
on:
  schedule: [{ cron: "0 21 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wantaekchoi/pokerepo@v1
        with:
          readme: .pokerepo/card.md
          party: 6
          columns: 6
          rotate: 2
          sprite: home
          commit: "false"
      - run: npm install --prefix .pokerepo --no-save --silent
      - run: node .pokerepo/render.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A trainer.json cards README.md .pokerepo/card.md
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "chore: update pokerepo"
          git push
